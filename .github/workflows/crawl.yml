name: Crawl Dean Notices
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/crawl-dean.mjs
      - name: Commit
        run: |
          git config --global user.name "crawl-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add public/notices.json
          git commit -m "chore: update notices" || echo "no changes"
          giname: Crawl Dean Notices
